plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"meetcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Bundled inside our jar (with Plasmo Voice below), so players install exactly one mod. If someone also has a
	// standalone copy, Fabric Loader just uses the newest.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// In-game proximity voice. LGPL-3.0, shipped unmodified as its own nested jar.
	include "maven.modrinth:plasmo-voice:${project.plasmo_voice_version}"
	// Its client API, for pausing the in-game mic while the Meet mic is live (see PlasmoGuard).
	clientCompileOnly "maven.modrinth:plasmo-voice:${project.plasmo_voice_version}"

	// Localhost WebSocket server the browser extension connects to; bundled into the jar.
	clientImplementation "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
	include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"

	// Optional: Mod Menu's gear button opens MeetCraft's settings when it's installed.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
